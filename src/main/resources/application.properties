spring.application.name=demo1
server.port=8080

invoiceq.ai.base-url=http://127.0.0.1:8001

# Dedicated schema; no password is committed.
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/invoiceAi?currentSchema=invoice_ai}
spring.datasource.username=${DB_USERNAME:postgres}
spring.datasource.password=${DB_PASSWORD}
spring.flyway.schemas=invoice_ai
spring.flyway.default-schema=invoice_ai
spring.flyway.clean-disabled=true
spring.jackson.deserialization.fail-on-unknown-properties=true
server.error.include-message=never
server.error.include-stacktrace=never
